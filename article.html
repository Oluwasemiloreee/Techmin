<!DOCTYPE html>
<html lang="en">

<head>
    <title id="page-title">Techmin — Article</title>
    <meta id="page-description" name="description" content="Deep dives, explainers, and stories from the African tech world.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#A0103C">
    <link rel="shortcut icon" href="Img/TechminIcon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Inline code styling — not covered by the base stylesheet */
        .prose code {
            background: #f0faff;
            color: var(--other);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: .9em;
        }
        .article-not-found { padding: 120px 0; text-align: center; }
        .article-not-found h1 { font-size: 40px; color: var(--primary); }
    </style>
</head>

<body data-page="article">
    <div id="navbar-container"></div>
    <main>
        <!-- Populated by the inline script below, based on ?slug= -->
        <div id="article-root"></div>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="articles-data.js"></script>
    <script src="script.js"></script>
    <script>
        (function () {
            const root = document.getElementById('article-root');
            const slug = new URLSearchParams(window.location.search).get('slug');
            const article = (window.ARTICLES || []).find((a) => a.slug === slug);

            if (!article) {
                root.innerHTML = `
                    <div class="container narrow article-not-found">
                        <h1>Article not found</h1>
                        <p class="text-muted">We couldn't find that one — it may have moved.</p>
                        <a href="articles.html" class="btn btn-primary mt-3">Browse all articles</a>
                    </div>
                `;
                return;
            }

            document.getElementById('page-title').textContent = `${article.title} — Techmin`;
            document.getElementById('page-description').setAttribute('content', article.dek);

            root.innerHTML = `
                <header class="article-detail-hero">
                    <div class="container narrow">
                        <span class="category-pill">${article.categoryLabel}</span>
                        <h1>${article.title}</h1>
                        <p>${article.dek}</p>
                        <div class="article-author">
                            <div class="author-avatar">${article.authorInitials}</div>
                            <span><b>${article.author} · ${article.readTime}</small></b></span>
                            
                        </div>
                    </div>
                </header>
                <section class="article-reading">
                    <div class="container narrow">
                        <img class="article-cover" src="${article.image}" alt="${article.title}">
                        <div class="prose">${article.bodyHTML}</div>
                        <div class="article-share">
                            <b>Share this article</b>
                            <div>
                                <button aria-label="Share on LinkedIn"><i class="bi bi-linkedin"></i></button>
                                <button aria-label="Share on X"><i class="bi bi-twitter-x"></i></button>
                                <button class="copy-link" aria-label="Copy article link"><i class="bi bi-link-45deg"></i></button>
                            </div>
                        </div>
                    </div>
                </section>
            `;

            // Re-bind the copy-link button since it was just added to the DOM
            root.querySelector('.copy-link')?.addEventListener('click', async (event) => {
                try {
                    await navigator.clipboard.writeText(location.href);
                    event.currentTarget.innerHTML = '<i class="bi bi-check2"></i>';
                } catch (_) { /* Clipboard may be unavailable on local files. */ }
            });
        })();
    </script>
</body>

</html>
