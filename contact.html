<!DOCTYPE html>
<html lang="en">

<head>
    <title>Contact — Techmin</title>
    <meta name="description" content="Contact Techmin for partnerships, story ideas, feedback, and collaboration.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#A0103C">
    <link rel="shortcut icon" href="Img/TechminIcon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="contact">
    <div id="navbar-container"></div>
    <header class="inner-hero">
        <div class="container"><span class="eyebrow">CONTACT TECHMIN</span>
            <h1>Let’s talk about something useful.</h1>
            <p>Send a message about partnerships, story ideas, feedback, speaking, or collaboration.</p>
        </div>
    </header>
    <main>
        <section class="page-section">
            <div class="container">
                <div class="row g-5">
                    <div class="col-lg-5">
                        <p class="section-label">GET IN TOUCH</p>
                        <h2>We’d love to hear from you.</h2>
                        <p>Share enough detail for us to understand your request.</p>
                        <div class="contact-detail"><i
                                class="bi bi-envelope"></i><span><b>Email</b><small>hello@techminhq.com</small></span>
                        </div>
                        <!-- <div class="contact-detail"><i class="bi bi-clock"></i><span><b>Response time</b><small>Usually
                                    within 2–3 working days</small></span></div> -->
                    </div>
                    <div class="col-lg-7">
                        <form class="contact-form" data-form-type="contact">
                            <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="visually-hidden">
                            <div class="row g-3">
                                <div class="col-md-6"><label for="contact-name">Name</label><input id="contact-name"
                                        name="name" type="text" required></div>
                                <div class="col-md-6"><label for="contact-email">Email</label><input id="contact-email"
                                        name="email" type="email" required></div>
                                <div class="col-12"><label for="contact-subject">Subject</label><select
                                        id="contact-subject" name="subject" required>
                                        <option value="">Choose one</option>
                                        <option>Partnership</option>
                                        <option>Story idea</option>
                                        <option>Feedback</option>
                                        <option>Speaking or event</option>
                                        <option>Other</option>
                                    </select></div>
                                <div class="col-12"><label for="contact-message">Message</label><textarea
                                        id="contact-message" name="message" rows="6" required></textarea></div>
                                <div class="col-12"><button class="btn btn-danger btn-lg" type="submit">Send
                                        message</button>
                                    <p class="form-status" aria-live="polite"></p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="script.js"></script>
</body>

</html>
